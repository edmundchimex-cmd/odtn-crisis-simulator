<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ODTN Vancouver | Module 5 Cyber Incident Response</title>
    <meta name="description" content="An interactive learning portal for cyber incident response, human factors, legal readiness, evidence handling, and operational resilience.">
    <meta name="theme-color" content="#070a14">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.468.0"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#131b2e', 950: '#070a14' },
                        cyan: { 450: '#18bcdb' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        :root { color-scheme: dark; scroll-behavior: smooth; }
        body { text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; background-color: #0b1424 !important; }
        .hidden { display: none !important; }
    </style>
</head>

<body class="h-full text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950 relative overflow-x-hidden min-h-screen">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4 backdrop-blur-xl">
        <div class="bg-slate-900/90 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden backdrop-blur-md">
            <div class="text-center space-y-2">
                <div class="bg-cyan-500/10 p-3.5 rounded-2xl border border-cyan-500/20 w-fit mx-auto text-cyan-400 shadow-inner">
                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">ODTN Secure Portal</h2>
                <p class="text-xs text-slate-400">Supabase Auth sign-in · security training demo</p>
            </div>

            <!-- Added method="POST" to prevent URL exposure -->
            <form id="form-login-step1" method="POST" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" for="login-user">USERNAME (EMAIL ADDRESS)</label>
                    <input type="email" id="login-user" name="username" required maxlength="254" value="edmundchimex@gmail.com" placeholder="Enter your email" autocomplete="username"
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition shadow-inner">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" for="login-password">PASSWORD</label>
                    <input type="password" id="login-password" name="password" required minlength="6" maxlength="128" value="siberX!@%7" placeholder="Enter your password" autocomplete="current-password"
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition shadow-inner">
                </div>

                <!-- Error Message Display -->
                <div id="login-error" class="hidden text-xs text-rose-400 font-mono text-center bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-lg" role="alert"></div>

                <button type="submit" id="login-btn" class="w-full py-3.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/25 flex items-center justify-center space-x-2">
                    <span>Sign in securely</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- TOP NAVIGATION HEADER -->
    <header class="bg-slate-900/80 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <h1 class="text-sm font-extrabold text-white uppercase tracking-tight">ODTN Vancouver - Module 5</h1>
            <button onclick="triggerLogout()" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl transition text-xs font-semibold">Logout</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <section id="view-briefing" class="space-y-6">
            <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7">
                <div class="max-w-4xl space-y-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-cyan-400">ODTN Vancouver · Module 5</p>
                    <h2 class="text-3xl sm:text-4xl font-bold tracking-tight leading-tight text-white">Human Dynamics in High-Stress Cyber Crisis</h2>
                </div>
            </div>
        </section>
    </main>

    <!-- Supabase Client & Login Handling Script -->
    <script>
        const SUPABASE_URL = 'https://yyuszmuyjuxuazakgasa.supabase.co';
        // MAKE SURE THIS IS YOUR EXACT PUBLISHABLE KEY FROM SUPABASE DASHBOARD:
        const SUPABASE_ANON_KEY = 'PASTE_YOUR_ACTUAL_PUBLISHABLE_KEY_HERE'; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.lucide) lucide.createIcons();
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('login-overlay').classList.add('hidden');
            }
        });

        async function handleLogin(event) {
            // STOP the default form submission completely to prevent URL exposure
            event.preventDefault();
            
            const email = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-btn');
            
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                document.getElementById('login-overlay').classList.add('hidden');
            } catch (err) {
                errorDiv.textContent = err.message || 'Sign-in failed. Please verify user creation in Supabase.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign in securely</span><i data-lucide="arrow-right" class="w-4 h-4"></i>';
                if (window.lucide) lucide.createIcons();
            }
        }

        async function triggerLogout() {
            await supabase.auth.signOut();
            document.getElementById('login-overlay').classList.remove('hidden');
        }
    </script>
</body>
</html>
